# One workspace, one binary (#134). Library crates hold the deep modules
# (edn now; ir, scene, companion, viewer later) and the `uml-viewer` binary
# only dispatches subcommands to them.
[workspace]
resolver = "3"
members = ["crates/*"]
# Analysed fixture projects are not part of the build.
exclude = ["rust-fixture"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# Each mutation worker relinks ~19 viewer test binaries per mutant; full
# debuginfo peaked at 4.3 GB per worker and exhausted a 15 GiB WSL host with
# three workers. Line tables keep backtraces and peak at 1.8 GB.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false
