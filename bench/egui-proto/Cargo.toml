# PROTOTYPE (#131): throwaway egui/eframe renderer for the bench/ protocol 1.
[package]
name = "egui-bench-proto"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
debug = 1
